[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gh-router"
version = "0.1.0"
description = "Deterministic GitHub CLI account routing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
gh-router = "gh_router.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_router"]
