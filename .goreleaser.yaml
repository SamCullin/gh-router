version: 2

project_name: gh-router

before:
  hooks:
    - go mod tidy

builds:
  - id: gh-router
    main: ./cmd/gh-router
    binary: gh-router
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/SamCullin/gh-router/internal/version.Version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

homebrew_casks:
  - repository:
      owner: SamCullin
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    binaries:
      - gh-router
    homepage: https://github.com/SamCullin/gh-router
    description: Deterministic GitHub CLI account routing
    custom_block: |
      binary "gh-router", target: "ghr"
      binary "gh-router", target: "ghrllm.text"
